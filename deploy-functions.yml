name: Deploy Firebase Functions

# Запускается автоматически при каждом пуше в ветку main,
# если изменились файлы внутри backend/functions.
# Также можно запустить вручную из вкладки Actions на GitHub ("Run workflow").
on:
  push:
    branches: [ main ]
    paths:
      - 'backend/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install function dependencies
        working-directory: backend/functions
        run: npm install

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase
        working-directory: backend
        run: firebase deploy --only functions --token "$FIREBASE_TOKEN" --project sklad-19c1d
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
